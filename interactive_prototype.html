<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProCharge</title>
<style>
:root{
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --input-bg:#f1f5f9;
    --accent:#7c3aed;
    --accent-2:#22d3ee;
    --border:#e2e8f0;
    --shadow:0 8px 24px rgba(15,23,42,0.08);
}
body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#ffffff;
    --muted:#94a3b8;
    --input-bg:#0b1220;
    --accent:#7c3aed;
    --accent-2:#22d3ee;
    --border:#334155;
    --shadow:0 8px 24px rgba(0,0,0,0.35);
}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    transition:background .25s ease,color .25s ease;
}
.app{
    width:100%;
    max-width:420px;
    padding:20px;
    min-height:100vh;
    box-sizing:border-box;
}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
.logo-wrap{
    text-align:center;
    margin-top:8px;
    margin-bottom:10px;
}
.logo{
    width:110px;
    max-width:40%;
    height:auto;
    display:block;
    margin:0 auto 8px;
}
.brand{
    font-size:26px;
    font-weight:700;
}
.subtitle{
    font-size:14px;
    color:var(--muted);
    margin-top:4px;
    line-height:1.5;
    text-align:center;
}
.control-row{
    display:flex;
    gap:10px;
}
.control-row select,
.control-row button{
    margin:0;
}
.card{
    background:var(--card);
    padding:18px;
    border-radius:18px;
    margin-top:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}
label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:2px;
}
select,
input[type="number"]{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    box-sizing:border-box;
}
select{
    appearance:none;
}
.range-wrapper{
    margin-bottom:14px;
}
.range-value{
    font-size:14px;
    margin-top:0;
    margin-bottom:8px;
    color:var(--accent-2);
    font-weight:600;
}
.slider-control{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    margin-bottom:8px;
}
.slider-control input[type="range"]{
    flex:1;
}
input[type="range"]{
    width:100%;
    height:8px;
    padding:0;
    margin:0;
    border:none;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent) 80%, var(--border) 80%, var(--border) 100%);
    box-sizing:border-box;
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{
    height:8px;
    border-radius:999px;
    background:transparent;
}
input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid #ffffff;
    margin-top:-7px;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
}
input[type="range"]::-moz-range-track{
    height:8px;
    border-radius:999px;
    background:transparent;
}
input[type="range"]::-moz-range-thumb{
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid #ffffff;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
}
.step-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}
.step-btn:active{
    transform:scale(0.96);
}
.tou-box{
    background:var(--input-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-top:6px;
    margin-bottom:14px;
}
.tou-status{
    font-weight:700;
    font-size:15px;
    color:var(--accent);
}
.tou-detail{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
}

.charger-auto-note{
    background:var(--input-bg);
    border:1px dashed var(--border);
    border-radius:12px;
    padding:10px 12px;
    margin-top:-4px;
    margin-bottom:14px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}
.charger-auto-note strong{
    color:var(--accent);
}
.button{
    background:var(--accent);
    color:#fff;
    padding:14px;
    border-radius:14px;
    text-align:center;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    user-select:none;
}
.button:hover{
    filter:brightness(1.05);
}
.result{
    margin-top:15px;
    font-size:14px;
    line-height:1.75;
    color:var(--text);
}
.highlight{
    margin-top:10px;
    font-size:18px;
    font-weight:700;
    color:var(--accent-2);
}
.note{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
}
.small{
    color:var(--muted);
    font-size:13px;
}
.toggle-btn{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    white-space:nowrap;
}
@media (max-width:420px){
    .control-row{
        flex-direction:column;
    }
}
</style>
</head>

<div class="app">

    <div class="logo-wrap">
        <img class="logo" src="https://www.pea.co.th/sites/default/files/PEA-Logo.png" alt="PEA Logo">
        <div class="brand">ProCharge</div>
        <div class="subtitle" id="subtitleText">Estimate charging cost before you plug in.</div>
    </div>

    <div class="topbar">
        <div class="control-row" style="width:100%;">
            <select id="languageSelect">
                <option value="th">ไทย</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ms">Melayu</option>
            </select>
            <button class="toggle-btn" id="themeToggle" type="button">Dark Mode</button>
        </div>
    </div>

    <div class="card">
        <label for="brandSelect" id="labelBrand">Select Brand</label>
        <select id="brandSelect">
            <option value="">-- Select Brand --</option>
        </select>

        <label for="carSelect" id="labelModel">Select Model</label>
        <select id="carSelect" disabled>
            <option value="" data-battery="">-- Select Model --</option>
        </select>

        <label for="current" id="labelCurrent">Current Battery (%)</label>
        <div class="range-wrapper">
            <div class="slider-control">
                <button class="step-btn" type="button" onclick="adjustSlider('current', -1)">−</button>
                <input type="range" id="current" min="0" max="100" value="20">
                <button class="step-btn" type="button" onclick="adjustSlider('current', 1)">+</button>
            </div>
            <div class="range-value" id="currentValue">Current: 20%</div>
        </div>

        <label for="target" id="labelTarget">Target Battery (%)</label>
        <div class="range-wrapper">
            <div class="slider-control">
                <button class="step-btn" type="button" onclick="adjustSlider('target', -1)">−</button>
                <input type="range" id="target" min="0" max="100" value="80">
                <button class="step-btn" type="button" onclick="adjustSlider('target', 1)">+</button>
            </div>
            <div class="range-value" id="rangeValue">Target: 80%</div>
        </div>

        <label id="labelTime">Time of Use</label>
        <div class="tou-box">
            <div class="tou-status" id="touStatus">Checking TOU period...</div>
            <div class="tou-detail" id="touDetail"></div>
        </div>
        <input type="hidden" id="timeType" value="offpeak">

        <label for="charger" id="labelCharger">Charger Type</label>
        <select id="charger">
            <option value="CCS Combo II|25">CCS Combo II (25 kW)</option>
            <option value="CCS Combo II|50">CCS Combo II (50 kW)</option>
            <option value="CCS Combo II|120">CCS Combo II (120 kW)</option>
            <option value="CCS Combo II|300">CCS Combo II (300 kW)</option>
            <option value="CCS Combo II|360">CCS Combo II (360 kW)</option>
            <option value="AC Type 2|43">AC Type 2 (43 kW)</option>
            <option value="DC CHAdeMO|50">DC CHAdeMO (50 kW)</option>
        </select>
        <div class="charger-auto-note" id="chargerAutoNote"></div>

        <div class="button" onclick="calculate()" id="calculateBtn">Calculate</div>
        <div class="result" id="result"></div>
    </div>
</div>

let currentLang = "th";

document.getElementById("current").addEventListener("input", updateSliderLabels);

function setRangeFill(slider){
    const min = parseInt(slider.min, 10);
    const max = parseInt(slider.max, 10);
    const value = parseInt(slider.value, 10);
    const percent = ((value - min) / (max - min)) * 100;
    slider.style.background = `linear-gradient(90deg, var(--accent) 0%, var(--accent) ${percent}%, var(--border) ${percent}%, var(--border) 100%)`;
}

function updateSliderLabels(){
    const t = i18n[currentLang];
    const currentSlider = document.getElementById("current");
    const targetSlider = document.getElementById("target");

    document.getElementById("currentValue").innerText = t.currentText + ": " + currentSlider.value + "%";
    document.getElementById("rangeValue").innerText = t.targetText + ": " + targetSlider.value + "%";

    setRangeFill(currentSlider);
    setRangeFill(targetSlider);
}

function adjustSlider(id, step){
    const slider = document.getElementById(id);
    const value = parseInt(slider.value, 10);
    const min = parseInt(slider.min, 10);
    const max = parseInt(slider.max, 10);

    slider.value = Math.min(max, Math.max(min, value + step));
    updateSliderLabels();
}

function populateBrands() {
    const brandSelect = document.getElementById("brandSelect");
    const brands = [...new Set(carData.map(car => car.brand))].sort();

    brands.forEach(brand => {
        const option = document.createElement("option");
        option.value = brand;
        option.textContent = brand;
        brandSelect.appendChild(option);
    });
}

function populateModels(selectedBrand) {
    const carSelect = document.getElementById("carSelect");
    carSelect.innerHTML = `<option value="" data-battery="">${i18n[currentLang].selectModel}</option>`;

    if (!selectedBrand) {
        carSelect.disabled = true;
        return;
    }

    const models = carData
        .filter(car => car.brand === selectedBrand)
        .sort((a, b) => a.model.localeCompare(b.model));

    models.forEach(car => {
        const option = document.createElement("option");
        option.value = `${car.brand}|${car.model}|${car.battery}`;
        option.dataset.brand = car.brand;
        option.dataset.battery = car.battery;
        option.textContent = `${car.model} (${car.battery} kWh)`;
        carSelect.appendChild(option);
    });

    carSelect.disabled = false;
}

// ใส่เฉพาะ "วันหยุดจริง" ไม่ใส่วันหยุดชดเชย และไม่ใส่วันพืชมงคล
const EXTRA_THAI_HOLIDAYS = [
    // ตัวอย่าง: "2026-03-03"
];

function getBangkokDateParts(date = new Date()){
    const formatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Bangkok",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
    });

    const parts = formatter.formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
    }, {});

    const year = Number(parts.year);
    const month = Number(parts.month);
    const day = Number(parts.day);
    const hour = Number(parts.hour);
    const minute = Number(parts.minute);

    const dateKey = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const monthDayKey = `${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dayOfWeek = new Date(Date.UTC(year, month - 1, day)).getUTCDay(); // 0=Sun, 6=Sat

    return { year, month, day, hour, minute, dateKey, monthDayKey, dayOfWeek };
}

function isThaiHoliday(parts){
    return FIXED_THAI_HOLIDAYS.includes(parts.monthDayKey) ||
           EXTRA_THAI_HOLIDAYS.includes(parts.dateKey);
}

function getCurrentTOU(){
    const parts = getBangkokDateParts();
    const isWeekend = parts.dayOfWeek === 0 || parts.dayOfWeek === 6;
    const isHoliday = isThaiHoliday(parts);

    if (isWeekend){
        return { type: "offpeak", reasonKey: "touWeekend" };
    }

    if (isHoliday){
        return { type: "offpeak", reasonKey: "touHoliday" };
    }

    const isPeakTime = parts.hour >= 9 && parts.hour < 22;

    if (isPeakTime){
        return { type: "peak", reasonKey: "touWeekdayPeak" };
    }

    return { type: "offpeak", reasonKey: "touWeekdayOffPeak" };
}

function updateTOUAuto(){
    const t = i18n[currentLang];
    const tou = getCurrentTOU();

    document.getElementById("timeType").value = tou.type;
    document.getElementById("touStatus").innerText = tou.type === "peak" ? t.touPeakNow : t.touOffPeakNow;
    document.getElementById("touDetail").innerText = t[tou.reasonKey];
}

function applyChargerFromQR(){
    const t = i18n[currentLang];

    const chargerCode = (params.get("charger") || "").toLowerCase().trim();
    const stationCode = (params.get("station") || "").trim();

            chargerName + " (" + chargerPower + " kW)" +
            (stationCode ? "<br><strong>" + t.station + ":</strong> " + stationCode : "") +
            "<br>" + t.lockedByQR;
    } else {
        chargerSelect.disabled = false;
        note.innerHTML = t.chargerManual;
    }
}

function getRateByPower(power, timeType){
    if (power < 50){
        return timeType === "peak" ? 6.9 : 5.3;
    } else if (power < 100){
        return timeType === "peak" ? 8.2 : 6.3;
    } else if (power < 300){
        return timeType === "peak" ? 8.5 : 6.5;
    } else {
        return timeType === "peak" ? 9.7 : 7.2;
    }
}

function smartTopUp(cost){
    const targetCost = Math.ceil(cost);
    let bestTotal = null;
    let bestCombo = [];

    const sortedOptions = [...topUpOptions].sort((a, b) => b - a);

    function search(sum, combo, startIndex){
        if (sum >= targetCost){
            const isBetterTotal = bestTotal === null || sum < bestTotal;
            const isSameTotalButFewer = sum === bestTotal && combo.length < bestCombo.length;

            if (isBetterTotal || isSameTotalButFewer){
                bestTotal = sum;
                bestCombo = [...combo];
            }
            return;
        }

        if (bestTotal !== null && sum > bestTotal) return;
        if (bestTotal !== null && sum === bestTotal && combo.length >= bestCombo.length) return;

        for (let i = startIndex; i < sortedOptions.length; i++){
            combo.push(sortedOptions[i]);
            search(sum + sortedOptions[i], combo, i);
            combo.pop();
        }
    }

    search(0, [], 0);

    return {
        combo: bestCombo,
        total: bestTotal,
        leftover: bestTotal - cost
    };
}

function calculate(){
    const t = i18n[currentLang];
    const brand = document.getElementById("brandSelect").value;
    const carSelect = document.getElementById("carSelect");
    const selectedOption = carSelect.options[carSelect.selectedIndex];

    const battery = parseFloat(selectedOption.dataset.battery);
    const vehicleLabel = brand && selectedOption.value ? `${brand} ${selectedOption.text}` : "";

    const current = parseFloat(document.getElementById("current").value);
    const target = parseFloat(document.getElementById("target").value);
    const timeType = document.getElementById("timeType").value;

    const chargerRaw = document.getElementById("charger").value;
    const [chargerName, chargerPowerText] = chargerRaw.split("|");
    const chargerPower = parseFloat(chargerPowerText);

    if (!brand){
        document.getElementById("result").innerHTML = t.pleaseBrand;
        return;
    }

    if (!battery){
        document.getElementById("result").innerHTML = t.pleaseModel;
        return;
    }

    if (isNaN(current) || isNaN(target)){
        document.getElementById("result").innerHTML = t.pleaseBattery;
        return;
    }

    if (current < 0 || current > 100 || target < 0 || target > 100){
        document.getElementById("result").innerHTML = t.batteryRange;
        return;
    }

    if (target <= current){
        document.getElementById("result").innerHTML = t.targetHigher;
        return;
    }

    const efficiency = 0.9;
    const percent = (target - current) / 100;
    const energyToBattery = battery * percent;
    const meterEnergy = energyToBattery / efficiency;
    const rate = getRateByPower(chargerPower, timeType);
    const cost = meterEnergy * rate;
    const plan = smartTopUp(cost);

    document.getElementById("result").innerHTML =
        `<div class="small">${t.vehicle}: ${vehicleLabel}</div>` +
        `<div class="small">${t.chargerText}: ${chargerName} (${chargerPower} kW)</div>` +
        `<div class="small">${t.rate}: ${rate.toFixed(1)} Baht/kWh (${timeType === "peak" ? t.peak : t.offpeak})</div><br>` +
        `${t.energy}: ${meterEnergy.toFixed(2)} kWh<br>` +
        `${t.cost}: ${cost.toFixed(2)} Baht<br>` +
        `<div class="highlight">${t.topup}: ${plan.combo.join(" + ")} = ${plan.total} Baht</div>` +
        `${t.remain}: ${plan.leftover.toFixed(2)} Baht` +
        `<div class="note">${t.note}</div>`;
}
